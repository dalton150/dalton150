name: Update Profile Widgets

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

concurrency:
  group: profile-widgets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dalton150&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&count_private=true&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/github-stats.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=dalton150&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide=html,css
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: true

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=dalton150&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate contribution chart
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: dalton150
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            contributions.svg?theme=dark&style=clean&period=365&granularity=week&cumulative=true
          target_branch: output
          commit_message: "chore: update contribution chart"

      - name: Sync contribution chart to profile
        run: |
          mkdir -p profile
          for attempt in 1 2 3 4 5; do
            git fetch origin output
            if git show origin/output:contributions.svg > profile/contributions.svg; then
              if [ -s profile/contributions.svg ]; then
                echo "Synced contribution chart on attempt ${attempt}"
                exit 0
              fi
            fi
            echo "Waiting for output branch chart (attempt ${attempt})..."
            sleep 5
          done
          echo "Failed to sync contribution chart from output branch"
          exit 1

      - name: Commit profile widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-stats.svg profile/top-langs.svg profile/streak.svg profile/contributions.svg
          git diff --staged --quiet && echo "No widget changes" && exit 0
          git commit -m "chore: update profile widgets"
          git push
