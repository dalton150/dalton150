name: Update Profile Widgets

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

concurrency:
  group: profile-widgets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=dalton150&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate contribution chart
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: dalton150
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            contributions.svg?theme=dark&style=clean&period=365&granularity=week&cumulative=true
          target_branch: output
          commit_message: "chore: update contribution chart"

      - name: Sync contribution chart to profile
        run: |
          git fetch origin output
          mkdir -p profile
          git show origin/output:contributions.svg > profile/contributions.svg

      - name: Commit profile widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/contributions.svg
          git diff --staged --quiet && echo "No widget changes" && exit 0
          git commit -m "chore: update profile streak and contribution chart"
          git push
